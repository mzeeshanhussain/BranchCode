<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Branch Redirect Test</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 16px;
      color: #111;
    }

    a {
      color: #0645ad;
    }
  </style>
</head>
<body>
  <p>Redirecting to Branch link...</p>
  <p><a id="fallback-link" href="https://linkdebugger.app.link/6wAEyVTPx6b">Open Branch link</a></p>

  <script>
    var BRANCH_LINK = 'https://linkdebugger.app.link/6wAEyVTPx6b';

    function isMobileUserAgent() {
      return /Android|webOS|iPhone;|iPad;|iProd;|itouch;|iPod|BlackBerry|IEMobile|Opera Mini|(Windows Phone)/i.test(navigator.userAgent);
    }

    function redirectToBranchLink() {
      var userAgent = navigator.userAgent;

      if (/\bAndroid 2.[01]\b/.test(userAgent) || /\bAndroid 1.[0-9]\b/.test(userAgent)) {
        window.location = BRANCH_LINK;
      } else if (/\bOS [4]_[0-2]\w*\b/.test(userAgent) || /\bOS [123]_[0-9]\w*\b/.test(userAgent)) {
        window.location = BRANCH_LINK;
      } else if (/(Windows Phone)/.test(userAgent)) {
        window.location = BRANCH_LINK;
      } else {
        window.location = BRANCH_LINK;
      }
    }

    if (isMobileUserAgent()) {
      redirectToBranchLink();
    } else {
      document.querySelector('p').textContent = 'Desktop detected. Use the link below to open the Branch link.';
    }
  </script>
</body>
</html>
